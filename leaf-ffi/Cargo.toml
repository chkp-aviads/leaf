[package]
name = "leaf-ffi"
version = "0.1.0"
authors = ["eycorsican <eric.y.corsican@gmail.com>"]
edition = "2021"

[lib]
name = "leaf"
path = "src/lib.rs"
crate-type = ["staticlib", "dylib"]

[features]
default = [
    "default-aws-lc",
    "auto-reload",
]

default-aws-lc= [
    "leaf/default-aws-lc",
]

# What Picard actually ships. See the `picard` feature in leaf/Cargo.toml.
picard = [
    "leaf/picard",
]

default-ring = [
    "leaf/default-ring",
]

default-openssl = [
    "leaf/default-openssl",
]

auto-reload = ["leaf/auto-reload"]

[dependencies]
leaf = { path = "../leaf", default-features = false, optional = true }
wg-netstack = { path = "../wg-netstack" }
tokio = { version = "1", features = ["rt"] }
anyhow = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"

[dev-dependencies]
wg-netstack = { path = "../wg-netstack", features = ["test-harness"] }
tokio = { version = "1", features = ["full"] }
