[package]
name = "wg-netstack"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Userspace WireGuard tunnel with a dial-capable TCP/IP stack, for leaf's wireguard outbound."

[dependencies]
# WireGuard Noise state machine only. We supply the socket, the netstack and the
# clock ourselves, so `device`/`ffi`/`jni` stay off.
boringtun = { version = "0.7.1", default-features = false }

# Userspace TCP/IP that can *originate* connections. leaf's existing
# netstack-smoltcp is accept-only, so it cannot be reused here.
tokio-smoltcp = { version = "0.6", default-features = false, features = ["proto-ipv4", "proto-ipv6"] }
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6"] }

# DNS wire format. Same version leaf already uses, so no second tree.
hickory-proto = { version = "0.24", default-features = false }

tokio = { version = "1", features = ["sync", "io-util", "net", "time", "rt", "macros"] }
tracing = "0.1"
bytes = "1"
futures = "0.3"
tokio-util = "0.7"
parking_lot = "0.12"
base64 = "0.22"
thiserror = "1.0"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
